# Render.com Infrastructure Blueprint Specification for AgroNexus
services:
  - type: web
    name: agronexus-backend-api
    env: docker
    dockerfilePath: deployment/Dockerfile.backend
    healthCheckPath: /actuator/health
    region: oregon
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SPRING_AI_OPENAI_API_KEY
        sync: false
