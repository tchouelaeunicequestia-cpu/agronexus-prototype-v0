name: AgroNexus CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter code
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and test backend
        working-directory: backend
        run: mvn --batch-mode verify

  docker:
    name: Backend container build & push
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/agronexus-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/agronexus-backend:${{ github.sha }}

      - name: Verify Documentation & SQL Scripts
        run: |
          echo "Verifying deployment artifacts..."
          test -f deployment/DEPLOYMENT_GUIDE.md
          test -f deployment/supabase_setup.sql
          test -f deployment/Dockerfile.backend
          test -f deployment/render.yaml
          echo "Deployment artifacts verified successfully!"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deployment/docker-compose.yml,.env
          target: /home/${{ secrets.VPS_USER }}/agronexus

      - name: Pull latest image and restart services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/agronexus
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/agronexus-backend:latest
            docker compose down
            docker compose up -d
            echo "Deployment completed successfully!"
